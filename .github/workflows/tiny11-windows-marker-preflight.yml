name: Tiny11 Windows first-login and second-boot marker validation
on:
  push:
    branches: [windows-tiny11-dual-ready-20261029]
    paths:
      - '.github/workflows/tiny11-windows-marker-preflight.yml'
      - 'tiny11-qcow2-lab/apply-tiny11-ready.ps1'
      - 'tiny11-qcow2-lab/finalize-ready.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows boot-probe batch syntax and FAT-disk marker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source='tiny11-qcow2-lab/apply-tiny11-ready.ps1'
          $tokens=$null;$issues=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $source).Path,[ref]$tokens,[ref]$issues)|Out-Null
          if($issues.Count){$issues|Out-Host;throw "PowerShell source parsing failed"}
          $tokens=$null;$otherIssues=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tiny11-qcow2-lab/finalize-ready.ps1').Path,[ref]$tokens,[ref]$otherIssues)|Out-Null
          if($otherIssues.Count){$otherIssues|Out-Host;throw 'Windows first-boot finalizer parser failed'}
          Write-Host 'PASS first-boot finalizer PowerShell parser'
          $raw=Get-Content $source -Raw
          $pattern="(?s)# A startup marker task.*?\@'\r?\n(?<batch>\@echo off.*?)(?:\r?\n)'\@"
          $match=[regex]::Match($raw,$pattern)
          if(-not $match.Success){throw "Startup marker script not extracted"}
          $dir=Join-Path $env:RUNNER_TEMP 'tiny11-marker-test'
          New-Item -ItemType Directory -Force -Path $dir|Out-Null
          $batch=Join-Path $dir 'Tiny11BootProbe.cmd'
          $match.Groups['batch'].Value|Set-Content -LiteralPath $batch -Encoding ASCII
          $drive='R:'
          if(Test-Path 'R:\'){throw "R: is already in use"}
          & subst.exe $drive $dir
          if($LASTEXITCODE -ne 0){throw "Cannot mount test FAT-simulation drive"}
          try {
            Set-Content -LiteralPath 'R:\TINY11_PROBE.TXT' -Value READY_FIRST_BOOT -Encoding ASCII
            & cmd.exe /d /c "$batch"
            if($LASTEXITCODE -ne 0){throw "Windows boot marker exited nonzero"}
            $ready='R:\TINY11_INSTALLED_READY.TXT'
            if(-not(Test-Path $ready)){throw "Windows boot marker did not write readiness file"}
            if((Get-Content $ready -Raw) -notmatch 'TINY11_INSTALLED_READY'){
              throw 'Guest marker content mismatch'
            }
            Write-Host "PASS: Windows boot marker detects assigned disk letter and writes ready proof"
          } finally {
            & subst.exe $drive /d | Out-Null
          }
          # Parse the embedded guest COM1 proof script with the real Windows
          # PowerShell parser instead of trusting only the outer script syntax.
          $serialBegin=$raw.IndexOf('param([ValidateSet("FirstReady","SecondBoot")]')
          if($serialBegin -lt 0){throw 'Embedded COM1 proof script missing'}
          $serialEnd=$raw.IndexOf("'@ | Set-Content -LiteralPath (Join-Path "+[char]36+"scriptDir 'Tiny11SerialProof.ps1')",$serialBegin)
          if($serialEnd -lt 0){throw 'Embedded COM1 script terminator missing'}
          $serialCode=$raw.Substring($serialBegin,$serialEnd-$serialBegin)
          $serialTokens=$null;$serialErrors=$null
          [System.Management.Automation.Language.Parser]::ParseInput($serialCode,[ref]$serialTokens,[ref]$serialErrors)|Out-Null
          if($serialErrors.Count){$serialErrors|Out-Host;throw 'Guest COM1 proof script syntax is invalid'}
          if($serialCode -notmatch 'TINY11_INSTALLED_READY SECOND_BOOT_CONFIRMED'){throw 'Second boot serial marker missing'}
          Write-Host 'PASS: Windows guest COM1 readiness proof PowerShell syntax'
          # Instantiate the exact constructor used in the Windows guest without
          # opening COM1; this catches errors that syntax-only tests miss.
          $port=[System.IO.Ports.SerialPort]::new("COM1",115200,[System.IO.Ports.Parity]::None,8,[System.IO.Ports.StopBits]::One)
          try {
            if($port.PortName -ne 'COM1' -or $port.BaudRate -ne 115200 -or $port.DataBits -ne 8){
              throw 'Guest serial constructor properties do not match COM1 protocol'
            }
          } finally { $port.Dispose() }
          Write-Host 'PASS: Guest COM1 SerialPort constructor executes on Windows runner'
          if($raw -notmatch 'TINY11_FIRST_LOGON_READY'){throw 'Missing first login proof'}
          if($raw -notmatch 'shutdown.exe /s /f /t 5'){throw 'No clean guest shutdown command'}
          if($raw -notmatch 'powercfg.exe /change standby-timeout-ac 0' -or $raw -notmatch 'powercfg.exe /change standby-timeout-dc 0'){
            throw 'Windows idle ACPI suspend protection missing'
          }
          Write-Host 'PASS: Windows AC and battery standby idle timeout disabled for persistent VM'
          Write-Host 'PASS: ready-disk Windows first login and shutdown hook present'
