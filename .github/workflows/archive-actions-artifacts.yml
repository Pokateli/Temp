name: Archive Actions data to Releases

on:
  push:
    paths:
      - .github/workflows/archive-actions-artifacts.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: actions-artifact-release-archive-${{ github.repository }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Archive and verify Actions artifacts
        shell: bash
        run: |
          set -Eeuo pipefail

          MONTH="$(date -u +%Y-%m)"
          TAG="actions-artifacts-archive-${MONTH}"
          MAX_ASSET_BYTES=2147483647
          ARCHIVE_DIR="$RUNNER_TEMP/actions-artifact-archive"
          VERIFY_DIR="$RUNNER_TEMP/actions-artifact-verify"
          mkdir -p "$ARCHIVE_DIR" "$VERIFY_DIR"

          ROWS="$(gh api --paginate \
            "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, .name, .size_in_bytes, .workflow_run.id] | @tsv')"

          RELEASE_EXISTS=0
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            RELEASE_EXISTS=1
          elif [[ -n "$ROWS" ]]; then
            gh release create "$TAG" --repo "$GH_REPO" \
              --title "Actions artifacts archive $MONTH" \
              --notes "Automatically archived GitHub Actions artifact ZIPs with SHA256 sidecars. Source artifacts are deleted only after GitHub's remote SHA256 digest and asset metadata are verified."
            RELEASE_EXISTS=1
          fi

          declare -A RUN_ALLOWED=()
          ARCHIVED=0
          SKIPPED=0

          if [[ -n "$ROWS" ]]; then
            while IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_NAME ARTIFACT_SIZE RUN_ID; do
              [[ -n "${ARTIFACT_ID:-}" ]] || continue

              if [[ -z "${RUN_ALLOWED[$RUN_ID]+x}" ]]; then
                RUN_META="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '[.event, (.head_repository.full_name // "")] | @tsv')"
                IFS=$'\t' read -r RUN_EVENT HEAD_REPO <<< "$RUN_META"
                if [[ "$RUN_EVENT" == "pull_request" || "$HEAD_REPO" != "$GH_REPO" ]]; then
                  RUN_ALLOWED[$RUN_ID]=0
                else
                  RUN_ALLOWED[$RUN_ID]=1
                fi
              fi

              if [[ "${RUN_ALLOWED[$RUN_ID]}" != "1" ]]; then
                echo "Skipping untrusted or pull-request artifact $ARTIFACT_ID ($ARTIFACT_NAME)."
                SKIPPED=$((SKIPPED + 1))
                continue
              fi

              if (( ARTIFACT_SIZE >= MAX_ASSET_BYTES )); then
                echo "Skipping artifact $ARTIFACT_ID ($ARTIFACT_NAME): exceeds 2 GiB release asset limit."
                SKIPPED=$((SKIPPED + 1))
                continue
              fi

              SAFE_NAME="$(printf '%s' "$ARTIFACT_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | cut -c1-80)"
              ASSET_NAME="run-${RUN_ID}-artifact-${ARTIFACT_ID}-${SAFE_NAME}.zip"
              ARCHIVE="$ARCHIVE_DIR/$ASSET_NAME"
              CHECKSUM="$ARCHIVE_DIR/${ASSET_NAME}.sha256"
              HEADERS="$ARCHIVE_DIR/${ASSET_NAME}.headers"

              echo "::group::Archive $ARTIFACT_NAME (run $RUN_ID, artifact $ARTIFACT_ID)"

              # Obtain the short-lived signed URL without following the redirect.
              # Never forward the repository token to GitHub's external blob host.
              HTTP_STATUS="$(curl --silent --show-error --retry 4 --retry-delay 2 \
                --output /dev/null --dump-header "$HEADERS" --write-out '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip")"

              if [[ "$HTTP_STATUS" != "302" && "$HTTP_STATUS" != "301" ]]; then
                echo "Unexpected artifact API HTTP status: $HTTP_STATUS. Keeping source."
                SKIPPED=$((SKIPPED + 1))
                rm -f "$HEADERS"
                echo "::endgroup::"
                continue
              fi

              DOWNLOAD_URL="$(awk 'tolower($1) == "location:" { sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); print }' "$HEADERS" | tail -n 1)"
              rm -f "$HEADERS"
              if [[ -z "$DOWNLOAD_URL" ]]; then
                echo "Missing signed download URL. Keeping source."
                SKIPPED=$((SKIPPED + 1))
                echo "::endgroup::"
                continue
              fi

              # The signed URL is self-authorizing; no GitHub token is sent to this host.
              curl --fail --location --silent --show-error \
                --retry 4 --retry-delay 2 \
                "$DOWNLOAD_URL" --output "$ARCHIVE"

              ACTUAL_SIZE="$(stat -c '%s' "$ARCHIVE")"
              if [[ "$ACTUAL_SIZE" != "$ARTIFACT_SIZE" ]]; then
                echo "Source size mismatch: API=$ARTIFACT_SIZE downloaded=$ACTUAL_SIZE. Keeping source."
                rm -f "$ARCHIVE"
                SKIPPED=$((SKIPPED + 1))
                echo "::endgroup::"
                continue
              fi

              HASH="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
              printf '%s  %s\n' "$HASH" "$ASSET_NAME" > "$CHECKSUM"
              CHECKSUM_SIZE="$(stat -c '%s' "$CHECKSUM")"

              gh release upload "$TAG" "$ARCHIVE" "$CHECKSUM" --repo "$GH_REPO" --clobber

              # GitHub exposes a server-computed SHA256 digest for release assets.
              ASSET_META="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | [.size, .digest] | @tsv')"
              IFS=$'\t' read -r REMOTE_SIZE REMOTE_DIGEST <<< "$ASSET_META"
              CHECKSUM_META="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq --arg name "${ASSET_NAME}.sha256" '.assets[] | select(.name == $name) | [.size, .digest] | @tsv')"

              if [[ "$REMOTE_SIZE" != "$ACTUAL_SIZE" || "$REMOTE_DIGEST" != "sha256:$HASH" || -z "$CHECKSUM_META" ]]; then
                echo "Remote release digest/size verification failed. Keeping source artifact."
                SKIPPED=$((SKIPPED + 1))
                rm -f "$ARCHIVE" "$CHECKSUM"
                echo "::endgroup::"
                continue
              fi

              gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" >/dev/null

              echo "Archived and SHA256-verified: $ASSET_NAME ($ACTUAL_SIZE bytes, $HASH); source deleted."
              ARCHIVED=$((ARCHIVED + 1))
              rm -f "$ARCHIVE" "$CHECKSUM"
              echo "::endgroup::"
            done <<< "$ROWS"
          else
            echo "No active Actions artifacts found; validating existing Release archive."
          fi

          # Reconcile every archived ZIP against GitHub's server-side SHA256 digest.
          if [[ "$RELEASE_EXISTS" == "1" ]]; then
            rm -f "$VERIFY_DIR"/*
            gh release download "$TAG" --pattern "*.zip.sha256" --dir "$VERIFY_DIR" --repo "$GH_REPO"

            ZIP_ROWS="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | select(.name | endswith(".zip")) | [.name, .size, .digest] | @tsv')"
            VERIFIED=0
            while IFS=$'\t' read -r ASSET_NAME ASSET_SIZE ASSET_DIGEST; do
              [[ -n "${ASSET_NAME:-}" ]] || continue
              SIDE="$VERIFY_DIR/${ASSET_NAME}.sha256"
              if [[ ! -s "$SIDE" ]]; then
                echo "Missing checksum sidecar for $ASSET_NAME"
                exit 1
              fi
              EXPECTED_HASH="$(awk 'NR == 1 {print $1}' "$SIDE")"
              REMOTE_HASH="${ASSET_DIGEST#sha256:}"
              if [[ -z "$EXPECTED_HASH" || "$EXPECTED_HASH" != "$REMOTE_HASH" ]]; then
                echo "SHA256 mismatch: $ASSET_NAME expected=$EXPECTED_HASH remote=$REMOTE_HASH"
                exit 1
              fi
              VERIFIED=$((VERIFIED + 1))
            done <<< "$ZIP_ROWS"
          else
            VERIFIED=0
          fi

          {
            echo "## Actions artifact archive"
            echo "- Repository: $GH_REPO"
            echo "- Release: $TAG"
            echo "- Newly archived and verified: $ARCHIVED"
            echo "- Existing release ZIPs SHA256-verified: $VERIFIED"
            echo "- Skipped / retained: $SKIPPED"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Completed: archived=$ARCHIVED verified=$VERIFIED skipped=$SKIPPED release=$TAG"

      - name: Archive workflow logs to Releases
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          MONTH="$(date -u +%Y-%m)"
          TAG="actions-logs-archive-${MONTH}"
          BAD_TAG='actions-logs-archive-${MONTH}'
          MAX_ASSET_BYTES=2147483647
          MAX_BATCH_BYTES=1700000000
          WORK_DIR="$RUNNER_TEMP/actions-log-archive"
          BATCH_DIR="$WORK_DIR/batch"
          mkdir -p "$WORK_DIR" "$BATCH_DIR"

          # Remove the empty tag created by the previous quoting bug, if present.
          if gh release view "$BAD_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release delete "$BAD_TAG" --repo "$GH_REPO" --yes --cleanup-tag
          fi

          RUN_ROWS="$(gh api --paginate \
            "repos/$GH_REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | [.id, .run_attempt, .created_at] | @tsv' |
            sort -k3,3)"

          if [[ -z "$RUN_ROWS" ]]; then
            echo "No completed workflow runs found."
            exit 0
          fi

          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GH_REPO" \
              --title "Actions logs archive $MONTH" \
              --notes "Archived GitHub Actions workflow log ZIPs, grouped by run and attempt. Original logs are deleted only after the Release bundle passes GitHub's remote SHA256 verification."
          fi

          BATCH_COUNT=0
          BATCH_BYTES=0
          BATCH_ATTEMPTS=0
          BATCH_FIRST=""
          BATCH_LAST=""
          ARCHIVED_RUNS=0
          ARCHIVED_ATTEMPTS=0
          SKIPPED_RUNS=0
          DELETED_RUNS=0
          declare -a BATCH_RUN_IDS=()
          : > "$BATCH_DIR/manifest.tsv"

          flush_batch() {
            if (( BATCH_COUNT == 0 )); then
              return 0
            fi

            local bundle_name="logs-${MONTH}-runs-${BATCH_FIRST}-${BATCH_LAST}.zip"
            local bundle="$WORK_DIR/$bundle_name"
            local checksum="$WORK_DIR/${bundle_name}.sha256"
            local bundle_size hash remote_json remote_meta remote_size remote_digest checksum_meta

            (cd "$WORK_DIR" && zip -qr "$bundle" batch)
            bundle_size="$(stat -c '%s' "$bundle")"
            if (( bundle_size >= MAX_ASSET_BYTES )); then
              echo "Bundle $bundle_name exceeds GitHub's 2 GiB asset limit; source logs are retained."
              return 1
            fi

            hash="$(sha256sum "$bundle" | awk '{print $1}')"
            printf '%s  %s\n' "$hash" "$bundle_name" > "$checksum"
            gh release upload "$TAG" "$bundle" "$checksum" --repo "$GH_REPO" --clobber

            remote_json="$(gh api "repos/$GH_REPO/releases/tags/$TAG")"
            remote_meta="$(jq -r --arg name "$bundle_name" \
              '.assets[] | select(.name == $name) | [.size, .digest] | @tsv' <<< "$remote_json")"
            IFS=$'\t' read -r remote_size remote_digest <<< "$remote_meta"
            checksum_meta="$(jq -r --arg name "${bundle_name}.sha256" \
              '.assets[] | select(.name == $name) | [.size, .digest] | @tsv' <<< "$remote_json")"

            if [[ "$remote_size" != "$bundle_size" ||
                  "$remote_digest" != "sha256:$hash" ||
                  -z "$checksum_meta" ]]; then
              echo "Remote SHA256/size verification failed for $bundle_name. All source logs in this batch are retained."
              return 1
            fi

            echo "Release bundle verified: $bundle_name ($bundle_size bytes, SHA256 $hash)."

            for run_id in "${BATCH_RUN_IDS[@]}"; do
              gh api --method DELETE "repos/$GH_REPO/actions/runs/$run_id/logs" >/dev/null
              DELETED_RUNS=$((DELETED_RUNS + 1))
              echo "Deleted original logs for workflow run $run_id after verified archive."
            done

            ARCHIVED_RUNS=$((ARCHIVED_RUNS + BATCH_COUNT))
            ARCHIVED_ATTEMPTS=$((ARCHIVED_ATTEMPTS + BATCH_ATTEMPTS))
            rm -f "$bundle" "$checksum"
            rm -rf "$BATCH_DIR"
            mkdir -p "$BATCH_DIR"
            : > "$BATCH_DIR/manifest.tsv"
            BATCH_COUNT=0
            BATCH_BYTES=0
            BATCH_ATTEMPTS=0
            BATCH_FIRST=""
            BATCH_LAST=""
            BATCH_RUN_IDS=()
          }

          while IFS=$'\t' read -r RUN_ID RUN_ATTEMPT CREATED_AT; do
            [[ -n "${RUN_ID:-}" ]] || continue

            # The current workflow is still running; its logs remain for the next manual run.
            if [[ "$RUN_ID" == "$GITHUB_RUN_ID" ]]; then
              continue
            fi

            if ! [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid attempt number for run $RUN_ID; keeping its logs."
              SKIPPED_RUNS=$((SKIPPED_RUNS + 1))
              continue
            fi

            RUN_TMP="$WORK_DIR/run-$RUN_ID"
            rm -rf "$RUN_TMP"
            mkdir -p "$RUN_TMP"
            RUN_OK=1
            RUN_BYTES=0
            RUN_ATTEMPT_COUNT=0

            for ATTEMPT in $(seq 1 "$RUN_ATTEMPT"); do
              HEADERS="$RUN_TMP/attempt-$ATTEMPT.headers"
              DOWNLOAD="$RUN_TMP/attempt-$ATTEMPT.download"
              HTTP_STATUS="$(curl --silent --show-error --retry 3 --retry-delay 2 \
                --output /dev/null --dump-header "$HEADERS" --write-out '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/logs")"

              if [[ "$HTTP_STATUS" == "404" || "$HTTP_STATUS" == "410" ]]; then
                echo "No downloadable logs for run $RUN_ID attempt $ATTEMPT; retaining the run's logs."
                RUN_OK=0
                break
              fi

              if [[ "$HTTP_STATUS" != "302" && "$HTTP_STATUS" != "301" ]]; then
                echo "Unexpected HTTP $HTTP_STATUS for run $RUN_ID attempt $ATTEMPT; stopping without deleting logs."
                exit 1
              fi

              DOWNLOAD_URL="$(awk 'tolower($1) == "location:" { sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); print }' "$HEADERS" | tail -n 1)"
              rm -f "$HEADERS"
              if [[ -z "$DOWNLOAD_URL" ]]; then
                echo "Missing signed URL for run $RUN_ID attempt $ATTEMPT; stopping without deleting logs."
                exit 1
              fi

              curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
                "$DOWNLOAD_URL" --output "$DOWNLOAD"

              ATTEMPT_SIZE="$(stat -c '%s' "$DOWNLOAD")"
              if (( ATTEMPT_SIZE == 0 || ATTEMPT_SIZE >= MAX_ASSET_BYTES )); then
                echo "Invalid or oversized log archive for run $RUN_ID attempt $ATTEMPT; retaining source logs."
                RUN_OK=0
                break
              fi

              if ! unzip -tq "$DOWNLOAD" >/dev/null; then
                echo "Log ZIP validation failed for run $RUN_ID attempt $ATTEMPT; retaining source logs."
                RUN_OK=0
                break
              fi

              ATTEMPT_HASH="$(sha256sum "$DOWNLOAD" | awk '{print $1}')"
              ATTEMPT_NAME="run-${RUN_ID}-attempt-${ATTEMPT}-logs.zip"
              mv "$DOWNLOAD" "$RUN_TMP/$ATTEMPT_NAME"
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$RUN_ID" "$ATTEMPT" "$CREATED_AT" "$ATTEMPT_NAME" "$ATTEMPT_HASH" \
                >> "$RUN_TMP/manifest.tsv"

              RUN_BYTES=$((RUN_BYTES + ATTEMPT_SIZE))
              RUN_ATTEMPT_COUNT=$((RUN_ATTEMPT_COUNT + 1))
            done

            if [[ "$RUN_OK" != "1" || "$RUN_ATTEMPT_COUNT" -ne "$RUN_ATTEMPT" ]]; then
              rm -rf "$RUN_TMP"
              SKIPPED_RUNS=$((SKIPPED_RUNS + 1))
              continue
            fi

            if (( RUN_BYTES > MAX_BATCH_BYTES )); then
              echo "Run $RUN_ID logs exceed the safe bundle size; retaining source logs."
              rm -rf "$RUN_TMP"
              SKIPPED_RUNS=$((SKIPPED_RUNS + 1))
              continue
            fi

            if (( BATCH_COUNT > 0 )) &&
               (( BATCH_COUNT >= 20 || BATCH_BYTES + RUN_BYTES > MAX_BATCH_BYTES )); then
              flush_batch
            fi

            mkdir -p "$BATCH_DIR/run-$RUN_ID"
            mv "$RUN_TMP"/*.zip "$BATCH_DIR/run-$RUN_ID/"
            cat "$RUN_TMP/manifest.tsv" >> "$BATCH_DIR/manifest.tsv"
            rm -rf "$RUN_TMP"

            if (( BATCH_COUNT == 0 )); then
              BATCH_FIRST="$RUN_ID"
            fi
            BATCH_LAST="$RUN_ID"
            BATCH_RUN_IDS+=("$RUN_ID")
            BATCH_COUNT=$((BATCH_COUNT + 1))
            BATCH_BYTES=$((BATCH_BYTES + RUN_BYTES))
            BATCH_ATTEMPTS=$((BATCH_ATTEMPTS + RUN_ATTEMPT_COUNT))
          done <<< "$RUN_ROWS"

          flush_batch

          {
            echo "## Actions workflow log archive"
            echo "- Repository: $GH_REPO"
            echo "- Release: $TAG"
            echo "- Archived workflow runs: $ARCHIVED_RUNS"
            echo "- Archived attempts: $ARCHIVED_ATTEMPTS"
            echo "- Original run logs deleted after verification: $DELETED_RUNS"
            echo "- Skipped / retained runs: $SKIPPED_RUNS"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Completed: archived_runs=$ARCHIVED_RUNS attempts=$ARCHIVED_ATTEMPTS deleted_runs=$DELETED_RUNS skipped_runs=$SKIPPED_RUNS release=$TAG"
