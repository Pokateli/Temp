name: AUPE 0.5.70 Rust staticlib + C ABI (NO VM)
on:
  push:
    branches:
      - aupe/0.5.70-linux-rust-bridge
    paths:
      - .github/workflows/aupe-070-rust-staticlib.yml
      - aupe-lab/v070-rust-linux-bridge/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-c-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install ephemeral Rust 1.89 toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Test no_std Rust core and real C-to-Rust ABI
        run: |
          set -euo pipefail
          cd aupe-lab/v070-rust-linux-bridge
          export CARGO_TARGET_DIR="$RUNNER_TEMP/aupe070-build"
          cargo test --release --offline --locked --manifest-path rust/Cargo.toml
          cargo build --release --offline --locked --manifest-path rust/Cargo.toml --lib --bin kernel_smoke
          "$CARGO_TARGET_DIR/release/kernel_smoke"
          rustc --edition=2024 --crate-name aupe_rust_core --crate-type=rlib -C panic=abort \
             rust/src/lib.rs -o "$RUNNER_TEMP/aupe070-nostd.rlib"
          CC=gcc bash scripts/test-abi.sh "$CARGO_TARGET_DIR/release/libaupe_rust_core.a"
          CC=clang OUT="$RUNNER_TEMP/aupe070_abi_clang" bash scripts/test-abi.sh "$CARGO_TARGET_DIR/release/libaupe_rust_core.a"
          echo AUPE070_RUST_C_ABI_GCC_CLANG=PASS
      - name: Temporary local-only library transfer (NO guest execution)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aupe070-transfer"
          cp "$RUNNER_TEMP/aupe070-build/release/libaupe_rust_core.a" "$RUNNER_TEMP/aupe070-transfer/"
          cp "$RUNNER_TEMP/aupe070-build/release/kernel_smoke" "$RUNNER_TEMP/aupe070-transfer/"
          (cd "$RUNNER_TEMP/aupe070-transfer" && sha256sum libaupe_rust_core.a kernel_smoke > SHA256SUMS)
      - name: Transfer tested lib to ChatGPT, delete after receipt
        uses: actions/upload-artifact@v4
        with:
          name: aupe-070-rust-staticlib-temp-20261101
          path: ${{ runner.temp }}/aupe070-transfer/
          compression-level: 6
          retention-days: 1
          if-no-files-found: error
