  ubuntu-kvm:
    needs: windows-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim Ubuntu runner disk space for Windows VM
        shell: bash
        run: |
          set -Eeuo pipefail
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h .
      - name: Install KVM, QEMU ZSTD and OVMF
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -w /dev/kvm
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd
          test -f /usr/share/OVMF/OVMF_VARS_4M.fd
          qemu-system-x86_64 --version
      - uses: actions/download-artifact@v4
        name: Download stage shard integrity index
        with:
          name: tiny11-kvm-stage-index
          path: tiny11-stage-shards/
      - uses: actions/download-artifact@v4
        name: Download all 384MiB stage shards with native action ZIPs
        with:
          pattern: tiny11-kvm-stage-part-*
          path: tiny11-stage-shards/
          merge-multiple: true
      - name: Reassemble exact SHA256-verified Windows stage disk and credentials
        shell: bash
        timeout-minutes: 20
        run: |
          set -Eeuo pipefail
          df -h .
          python3 windows-vm-runtime/ready-parts.py unpack tiny11-stage-shards "$RUNNER_TEMP/tiny11-kvm-stage" --kind stage
          cd "$RUNNER_TEMP/tiny11-kvm-stage"
          test -s tiny11-zstd.qcow2 && test -s ready-credentials.txt
          sha256sum tiny11-zstd.qcow2 ready-credentials.txt
          cd "$GITHUB_WORKSPACE"
          rm -rf tiny11-stage-shards
          echo 'PASS: all stage chunks and both files individually verified before boot'
          df -h .
      - name: Verify Windows stage SHA256 and available disk
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/tiny11-kvm-stage"
          sha256sum -c STAGE-SHA256SUMS
          qemu-img info tiny11-zstd.qcow2
          df -h .
      - name: Boot real Windows OOBE under Linux KVM and require clean shutdown
        shell: bash
        timeout-minutes: 65
        run: |
          set -Eeuo pipefail
          python3 windows-vm-runtime/finalize-ready-kvm.py --vm-dir "$RUNNER_TEMP/tiny11-kvm-stage" --seconds 3400
      - name: Verify ZSTD ready image and confirm second Windows boot under KVM
        shell: bash
        timeout-minutes: 28
        run: |
          set -Eeuo pipefail
          python3 windows-vm-runtime/dual-run.py verify --vm-dir "$RUNNER_TEMP/tiny11-kvm-stage"
          python3 windows-vm-runtime/dual-run.py probe --vm-dir "$RUNNER_TEMP/tiny11-kvm-stage" --accelerator kvm --headless --seconds 1400
          grep -q '"boot_confirmed": true' "$RUNNER_TEMP/tiny11-kvm-stage/probe-result.json"
      - name: Remove redundant first-boot stage and stream ready kit into 384MiB public shards
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/tiny11-kvm-stage"
          rm -f "$root/tiny11-zstd.qcow2" "$root/tiny11-firstboot.qcow2" "$root/tiny11-session.qcow2"
          df -h .
          python3 windows-vm-runtime/ready-parts.py pack "$root" tiny11-public-parts
          python3 -c 'import json; p=json.load(open("tiny11-public-parts/ready-parts.json")); assert len(p["parts"])<=32, "Ready disk needs more than 32 transfer shards"'
      - uses: actions/upload-artifact@v4
        name: Upload public ready image index
        with:
          name: tiny11-ready-public-index
          path: tiny11-public-parts/ready-parts.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload public diagnostic proof without OS image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny11-kvm-guest-proof
          path: |
            ${{ runner.temp }}/tiny11-kvm-stage/firstboot-qemu.log
            ${{ runner.temp }}/tiny11-kvm-stage/firstboot-serial.log
            ${{ runner.temp }}/tiny11-kvm-stage/firstboot-*.ppm
            ${{ runner.temp }}/tiny11-kvm-stage/qemu-serial.log
            ${{ runner.temp }}/tiny11-kvm-stage/qemu-probe.log
            ${{ runner.temp }}/tiny11-kvm-stage/probe-result.json
