name: Tiny11 KVM ready disk - public unencrypted dev artifacts
on:
  push:
    branches: [windows-tiny11-dual-ready-20261029]
    paths: ['.github/workflows/tiny11-ready-kvm-public.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-stage:
    runs-on: windows-2022
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
      - name: Validate build scripts before ISO download
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($f in @('tiny11-qcow2-lab/prepare-tiny11-wim.ps1','tiny11-qcow2-lab/apply-tiny11-ready.ps1')){
            $tok=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path,[ref]$tok,[ref]$errors)|Out-Null
            if($errors.Count){$errors|Out-Host;throw "PowerShell syntax invalid: $f"}
          }
          python -m py_compile windows-vm-runtime/finalize-ready-kvm.py windows-vm-runtime/dual-run.py windows-vm-runtime/ready-parts.py
          if($LASTEXITCODE -ne 0){throw 'Python scripts did not compile'}
      - name: 1. Download official Microsoft evaluation ISO with SHA256 verification
        shell: pwsh
        timeout-minutes: 20
        run: ./tiny11-qcow2-lab/prepare-tiny11-wim.ps1 -Stage Download
      - name: 2. Build customized Tiny11 install.wim via DISM
        shell: pwsh
        timeout-minutes: 85
        run: ./tiny11-qcow2-lab/prepare-tiny11-wim.ps1 -Stage Build
      - name: 3. Install Tiny11 UEFI Windows system into compressed ZSTD QCOW2
        shell: pwsh
        timeout-minutes: 60
        run: ./tiny11-qcow2-lab/apply-tiny11-ready.ps1
      - name: Hash exact pre-first-login disk and local development credentials
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'tiny11-lab'
          $names=@('tiny11-zstd.qcow2','ready-credentials.txt')
          $lines=@()
          foreach($name in $names){
            $p=Join-Path $root $name
            if(-not(Test-Path $p)){throw "Missing Windows stage asset: $name"}
            $hash=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines+=("$hash *$name")
          }
          $lines|Set-Content -Path (Join-Path $root 'STAGE-SHA256SUMS') -Encoding ASCII
          Write-Host 'Stage SHA256 manifest prepared. This public development workflow intentionally publishes plaintext Windows stage and local credentials.'
      - name: Split first-login Windows QCOW2 and credentials into independently verified 384MiB shards
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'tiny11-lab'
          python windows-vm-runtime/ready-parts.py pack $root tiny11-stage-shards --kind stage
          if($LASTEXITCODE -ne 0){throw 'Failed to shard 8GiB stage'}
          $index=Get-Content 'tiny11-stage-shards/stage-parts.json' -Raw | ConvertFrom-Json
          if(@($index.parts).Count -gt 32){throw 'Stage has too many shards for CI upload'}
          Write-Host "Stage split into $(@($index.parts).Count) artifacts <= 384MiB"
      - uses: actions/upload-artifact@v4
        name: Transfer manifest for SHA256 verified Windows stage shards
        with:
          name: tiny11-kvm-stage-index
          path: tiny11-stage-shards/stage-parts.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        name: Transfer Windows stage shard 000 (384 MiB max)
        if: ${{ hashFiles('tiny11-stage-shards/part-000.bin') != '' }}
        with:
