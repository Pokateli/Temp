name: Build Debian 13 portable QEMU TCG VM
on:
  push:
    branches: [debian13-qemu-tcg-20261029]
    paths:
      - 'debian13-vm/**'
      - '.github/workflows/build-debian13-vm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build VM bundle
        shell: bash
        run: |
          chmod +x debian13-vm/build.sh
          bash -n debian13-vm/build.sh
          mkdir -p output
          OUTPUT_DIR="$PWD/output" bash debian13-vm/build.sh
      - name: Validate files and QEMU runtime
        run: |
          set -Eeuo pipefail
          cd output/debian13-qemu-bundle
          sha256sum -c SHA256SUMS
          ./lib/ld-linux-x86-64.so.2 --library-path ./lib ./bin/qemu-system-x86_64 -L ./share/qemu -machine help >/dev/null
          ./lib/ld-linux-x86-64.so.2 --library-path ./lib ./bin/qemu-img info debian13.qcow2
          timeout 35s ./start.sh > ../boot.log 2>&1 || code=$?
          echo "QEMU exit code: ${code:-0}"
          grep -Ei 'Linux version|Debian GNU/Linux|login:|root@|VFS: Mounted root|Starting kernel' ../boot.log | tail -n 20 || true
          test "${code:-0}" = 124 || test "${code:-0}" = 0
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: debian13-qemu-tcg-bundle
          path: |
            output/debian13-qemu-bundle.tar.gz
            output/debian13-qemu-bundle.tar.gz.sha256
            output/boot.log
          retention-days: 7
          compression-level: 0
