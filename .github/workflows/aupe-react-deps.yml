name: AUPE Manager React offline frontend dependencies
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/aupe-react-deps.yml
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build React dependency bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aupe-react-deps; cd aupe-react-deps
          cat > package.json <<'EOF'
          {"name":"aupe-manager-react-deps","version":"0.9.186","private":true,"type":"module","dependencies":{"react":"19.2.0","react-dom":"19.2.0","react-router-dom":"7.9.6","@tanstack/react-query":"5.90.10","@tanstack/react-table":"8.21.3","zustand":"5.0.8","react-hook-form":"7.65.0","zod":"4.1.12","@hookform/resolvers":"5.2.2","@radix-ui/react-dialog":"1.1.15","lucide-react":"0.468.0"},"devDependencies":{"vite":"8.2.2","typescript":"5.9.3","@types/react":"19.2.2","@types/react-dom":"19.2.2"}}
          EOF
          npm install --no-audit --no-fund
          npm ls --depth=0
          tar -czf ../aupe-react-node_modules-node22-amd64.tar.gz node_modules
          cp package-lock.json ../package-lock.json
          cd ..
          sha256sum aupe-react-node_modules-node22-amd64.tar.gz package-lock.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aupe-react-node22-amd64-v0.9.186
          path: |
            aupe-react-node_modules-node22-amd64.tar.gz
            package-lock.json
            SHA256SUMS
          compression-level: 0
          retention-days: 30
