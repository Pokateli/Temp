[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-sandboxvpn"
version = "0.1.0"
description = "Userspace SOCKS5 and fixed-destination UDP transport over WSS"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<17"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
sandboxvpn-client = "sandboxvpn.client:main"
sandboxvpn-gateway = "sandboxvpn.gateway:main"
sandboxvpn-mcp-handoff = "sandboxvpn.mcp_handoff:main"

[tool.setuptools.packages.find]
where = ["src"]

